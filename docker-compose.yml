services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: minebuild
      POSTGRES_USER: minebuild
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.local}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - minebuild-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U minebuild -d minebuild"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  minebuild-postgres-data:
